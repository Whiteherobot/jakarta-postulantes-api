name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ["21", "25"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: ./mvnw -B verify

  servidor:
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Armar WildFly con la app
        run: ./mvnw -B package -Pservidor -DskipTests
      - name: Levantar el servidor
        run: |
          scripts/servidor.sh > servidor.log 2>&1 &
          timeout 120 bash -c 'until grep -qE "WFLYSRV0025|WFLYSRV0026" servidor.log; do sleep 1; done'
          grep -q WFLYSRV0025 servidor.log || { cat servidor.log; exit 1; }
      - name: Probar la API
        run: scripts/probar-api.sh
      - if: failure()
        run: cat servidor.log
